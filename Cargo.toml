[package]
name = "painless-belt"
version = "0.1.2"
edition = "2024"
description = "Run a command in a macOS sandbox with sensible defaults."
license = "MIT"
repository = "https://github.com/shshemi/painless-belt"
homepage = "https://github.com/shshemi/painless-belt"
readme = "README.md"
keywords = ["sandbox", "macos", "security", "cli", "sandbox-exec"]
categories = ["command-line-utilities"]

[[bin]]
name = "pb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
dirs = "6.0.0"
hostname = "0.4"
libc = "0.2"
local-ip-address = "0.6"
minijinja = { version = "2", features = ["loader"] }
pastey = "0.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
ureq = "3"
url = "2.5.8"

[dev-dependencies]
nix = { version = "0.29", features = ["process"] }
